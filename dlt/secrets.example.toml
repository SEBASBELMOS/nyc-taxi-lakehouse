# ---------------------------------------------------------------------------
# dlt secrets - Proyecto Corte 1
#
# Copy this file to secrets.toml (same folder) and fill in the real values.
# secrets.toml is git-ignored on purpose: never commit it.
#
#   cp dlt/secrets.example.toml dlt/secrets.toml
#
# The folder is mounted into the Jupyter container at /home/jovyan/.dlt/,
# which is where dlt looks for credentials.
#
# Section names are scoped by pipeline name, so each script only sees the
# credentials it needs. `http_to_minio` below matches
# dlt.pipeline(pipeline_name="http_to_minio", ...) in 01_http_to_minio.py.
# ---------------------------------------------------------------------------

# --- 01_http_to_minio.py : filesystem destination on MinIO -----------------
[http_to_minio.destination.filesystem]
bucket_url = "s3://nyc-taxi-raw"

[http_to_minio.destination.filesystem.credentials]
aws_access_key_id = "admin"
aws_secret_access_key = "password123"
endpoint_url = "http://minio:9000"

# --- 03 and 04 : filesystem SOURCE reading Iceberg data files from MinIO ---
[sources.filesystem.credentials]
aws_access_key_id = "admin"
aws_secret_access_key = "password123"
endpoint_url = "http://minio:9000"

# --- 03_minio_to_azure.py : filesystem destination on Azure ADLS -----------
# Replace GRUPO_X with the folder assigned to your group.
[minio_to_azure.destination.filesystem]
bucket_url = "abfss://clase-4-dlt@fhbd.dfs.core.windows.net/GRUPO_X"

[minio_to_azure.destination.filesystem.credentials]
azure_storage_account_name = "fhbd"
azure_storage_account_key = "PASTE_THE_KEY_PROVIDED_BY_THE_INSTRUCTOR"

# --- 04_minio_to_clickhouse.py : ClickHouse destination --------------------
[minio_to_clickhouse.destination.clickhouse.credentials]
database = "default"
username = "default"
password = "clickhouse123"
host = "clickhouse"
port = 9000        # native TCP port, as seen from inside the Docker network
http_port = 8123   # HTTP interface
secure = 0
