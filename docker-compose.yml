name: proyecto-corte1

# ---------------------------------------------------------------------------
# Data stack - Proyecto Corte 1 (Frameworks y Herramientas para Big Data)
#
#   MinIO      -> Data Lake / Object Storage
#   Nessie     -> Iceberg catalog (REST)
#   ClickHouse -> Data Warehouse
#   Jupyter    -> interactive environment + pipeline runner
#
# Every service talks to the others by service name over the "datastack"
# network, so the stack is portable across machines and no host IP is ever
# hardcoded.
# ---------------------------------------------------------------------------

services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: corte1-minio
    command: server /data --address ":9000" --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'response="$$(exec 3<>/dev/tcp/localhost/9000 &&
          printf "GET /minio/health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 &&
          head -n 1 <&3)"; [[ "$${response}" == *"200 OK"* ]]'
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [datastack]

  # Creates both buckets before anything else runs. Idempotent.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: corte1-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - >-
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-admin} ${MINIO_ROOT_PASSWORD:-password123} &&
        mc mb --ignore-existing local/${RAW_BUCKET:-nyc-taxi-raw} &&
        mc mb --ignore-existing local/${ICEBERG_BUCKET:-nyc-taxi-iceberg} &&
        mc ls local
    restart: "no"
    networks: [datastack]

  # Nessie exposes an Iceberg REST catalog at http://nessie:19120/iceberg
  # Version store is ROCKSDB (NOT the IN_MEMORY default) so the namespace and
  # table survive a container restart - otherwise the catalog is empty every
  # time the stack comes back up.
  nessie:
    image: ghcr.io/projectnessie/nessie:0.108.4
    container_name: corte1-nessie
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      nessie.version.store.type: ROCKSDB
      nessie.version.store.persist.rocks.database-path: /nessie/data

      # Warehouse: base location for Iceberg tables created through Nessie.
      nessie.catalog.default-warehouse: warehouse
      nessie.catalog.warehouses.warehouse.location: s3://${ICEBERG_BUCKET:-nyc-taxi-iceberg}

      # MinIO is S3-compatible but not AWS: endpoint + path-style are required.
      nessie.catalog.service.s3.default-options.region: us-east-1
      nessie.catalog.service.s3.default-options.endpoint: http://minio:9000
      nessie.catalog.service.s3.default-options.path-style-access: "true"
      nessie.catalog.service.s3.default-options.access-key: urn:nessie-secret:quarkus:minio-secret
      minio-secret.name: ${MINIO_ROOT_USER:-admin}
      minio-secret.secret: ${MINIO_ROOT_PASSWORD:-password123}
    ports:
      - "19120:19120"
    volumes:
      - nessie-data:/nessie/data
    networks: [datastack]

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: corte1-clickhouse
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse123}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"   # HTTP interface
      - "9002:9000"   # Native TCP. NOT 9000 on the host: MinIO owns that port.
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        - CMD-SHELL
        - clickhouse-client --user default --password "$${CLICKHOUSE_PASSWORD}" --query "SELECT 1"
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [datastack]

  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    image: corte1-jupyter:1.0
    container_name: corte1-jupyter
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      nessie:
        condition: service_started
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-corte1}
      DLT_DATA_DIR: /home/jovyan/state

      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-password123}
      RAW_BUCKET: ${RAW_BUCKET:-nyc-taxi-raw}
      ICEBERG_BUCKET: ${ICEBERG_BUCKET:-nyc-taxi-iceberg}

      NESSIE_URI: http://nessie:19120/iceberg
      NESSIE_NAMESPACE: ${NESSIE_NAMESPACE:-nyc_taxi}
      ICEBERG_TABLE: ${ICEBERG_TABLE:-yellow_tripdata_2025_01}

      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: "8123"
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse123}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-default}

      GROUP_FOLDER: ${GROUP_FOLDER:-GRUPO_X}
    ports:
      - "8888:8888"
    volumes:
      - ./scripts:/home/jovyan/scripts
      - ./notebooks:/home/jovyan/notebooks
      - ./evidencias:/home/jovyan/evidencias
      - ./dlt:/home/jovyan/.dlt
      - jupyter-state:/home/jovyan/state
    networks: [datastack]

volumes:
  minio-data:
  nessie-data:
  clickhouse-data:
  jupyter-state:

networks:
  datastack:
    name: corte1-datastack
